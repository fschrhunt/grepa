[package]
name = "grep-app-lite"
version = "0.1.0"
edition = "2021"
description = "Small safe CLI for the grep.app MCP server"
license = "MIT"
repository = "https://github.com/fschrhunt/grep-app-lite"

[dependencies]
lexopt = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
